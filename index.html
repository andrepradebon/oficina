<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oficina</title>
<meta name="theme-color" content="#1A1F24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Oficina">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Ferramenta de campo: uma coluna, alvos de toque grandes, faixa amarela de segurança como marca. */
:root{
  --bg:#E7EAEC; --surface:#FFFFFF; --sunk:#F1F3F4; --ink:#1A1F24; --muted:#5B6670; --line:#CDD3D8;
  --accent:#F2B705; --on-accent:#1A1F24; --accent-ink:#8A6400;
  --bad:#B6342A; --bad-bg:#F8DEDA; --warn:#94600A; --warn-bg:#FBEFCF; --ok:#1D7A4C; --ok-bg:#DDF1E6; --info:#255E91; --info-bg:#DDEAF6;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#111518; --surface:#1B2125; --sunk:#161B1F; --ink:#ECEFF1; --muted:#9AA5AE; --line:#2D363C;
  --accent:#F5C21B; --on-accent:#14181B; --accent-ink:#F5C21B;
  --bad:#F27466; --bad-bg:#3A1B18; --warn:#F0B44C; --warn-bg:#33270F; --ok:#5CCB93; --ok-bg:#16301F; --info:#7FB3E6; --info-bg:#18283A;
  color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.barra{display:flex;align-items:center;gap:10px;padding-block:10px;min-height:56px}
.faixa{width:28px;height:28px;border-radius:6px;flex:none;background:repeating-linear-gradient(-45deg,var(--accent) 0 6px,var(--on-accent) 6px 12px)}
.marca{font:700 22px/1 var(--display);letter-spacing:.03em;text-transform:uppercase;margin:0}
.voltar{background:none;border:0;color:var(--ink);font:600 16px var(--body);padding:8px 6px 8px 0;cursor:pointer;display:flex;align-items:center;gap:4px}
.quem{margin-left:auto;text-align:right;font-size:13px;color:var(--muted);line-height:1.2}
.quem b{display:block;color:var(--ink);font-size:14px}
.quem button{background:none;border:0;color:var(--muted);font:500 13px var(--body);padding:2px 0;cursor:pointer;text-decoration:underline}
main{padding-block:16px calc(48px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
h2{font:700 24px/1.1 var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0;text-wrap:balance}
h3{font:600 15px var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0}
p{margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.hint{font-size:14px;color:var(--muted)}
label,.campo{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
label small,.campo small{font-weight:400;color:var(--muted)}
input,select,textarea{font:500 17px var(--body);color:var(--ink);background:var(--sunk);border:1.5px solid var(--line);border-radius:8px;padding:12px;width:100%;min-height:50px}
textarea{min-height:96px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.linha{display:grid;grid-template-columns:1fr 1fr;gap:12px}.linha>*{min-width:0}
@media (max-width:380px){.linha{grid-template-columns:1fr}}
.btn{font:700 18px var(--display);letter-spacing:.06em;text-transform:uppercase;border:0;border-radius:8px;padding:14px 18px;min-height:54px;cursor:pointer;background:var(--accent);color:var(--on-accent);width:100%}
.btn.sec{background:transparent;color:var(--ink);border:1.5px solid var(--line);font-size:15px;min-height:46px}
.btn.perigo{background:transparent;color:var(--bad);border:1.5px solid var(--bad);font-size:15px;min-height:46px}
.btn:disabled{opacity:.5;cursor:wait}
.acoes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu{display:grid;gap:10px}
.item-menu{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;text-align:left;font:inherit;color:inherit;cursor:pointer;width:100%;min-height:72px}
.item-menu.prim{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.item-menu .t{font:700 20px/1.1 var(--display);text-transform:uppercase;letter-spacing:.03em;display:block}
.item-menu .s{font-size:14px;opacity:.8}
.item-menu .n{margin-left:auto;font:700 30px/1 var(--display);min-width:36px;text-align:right}
.item-menu .n.alerta{color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:600 15px var(--body);border:1.5px solid var(--line);background:var(--sunk);color:var(--ink);border-radius:999px;padding:9px 14px;cursor:pointer;min-height:42px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.situacao{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sit{border:2px solid var(--line);background:var(--sunk);border-radius:10px;padding:14px 10px;font:700 17px/1.15 var(--display);text-transform:uppercase;letter-spacing:.03em;color:var(--ink);cursor:pointer;min-height:64px}
.sit.parada[aria-pressed="true"]{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.sit.func[aria-pressed="true"]{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.busca-res{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.busca-res button{background:var(--surface);border:0;border-top:1px solid var(--line);text-align:left;padding:12px;font:inherit;color:inherit;cursor:pointer}
.busca-res button:first-child{border-top:0}
.busca-res b{display:block}.busca-res span{font-size:13px;color:var(--muted)}
.escolhida{display:flex;align-items:center;gap:10px;background:var(--sunk);border:1.5px solid var(--ink);border-radius:8px;padding:10px 12px}
.escolhida b{font:700 20px var(--display);text-transform:uppercase;letter-spacing:.02em;display:block}
.escolhida span{font-size:13px;color:var(--muted)}
.escolhida button{margin-left:auto;background:none;border:0;color:var(--muted);font:600 14px var(--body);text-decoration:underline;cursor:pointer;padding:8px}
.fotos{display:flex;flex-wrap:wrap;gap:8px}
.foto{position:relative;width:88px;height:88px;border-radius:8px;overflow:hidden;background:var(--sunk);border:1px solid var(--line)}
.foto img{width:100%;height:100%;object-fit:cover;display:block}
.foto button{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:16px;line-height:1;cursor:pointer}
.add-foto{width:88px;height:88px;border-radius:8px;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:13px;color:var(--muted);cursor:pointer;text-align:center;background:none;font-family:var(--body)}
.add-foto b{font-size:26px;line-height:1;color:var(--ink)}
.lista{display:flex;flex-direction:column;gap:10px}
.reg{display:grid;grid-template-columns:6px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 12px 12px 0;text-align:left;font:inherit;color:inherit;width:100%}
button.reg{cursor:pointer}
.reg .tarja{border-radius:0 4px 4px 0;background:var(--line)}
.reg.urgente .tarja,.reg.parada .tarja{background:var(--bad)}.reg.alta .tarja{background:var(--warn)}.reg.ok .tarja{background:var(--ok)}
.reg .corpo{display:flex;flex-direction:column;gap:6px;min-width:0}
.reg .topo{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}
.reg .maq{font:700 20px/1.1 var(--display);text-transform:uppercase;letter-spacing:.02em}
.reg .meta{font-size:13px;color:var(--muted)}
.reg .desc{font-size:15px;overflow-wrap:anywhere}
.pill{display:inline-flex;align-items:center;font:700 12px var(--body);letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:4px 10px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.info{background:var(--info-bg);color:var(--info)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:2px}
.tile .n{font:700 30px/1 var(--display)}.tile .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tile.bad .n{color:var(--bad)}
.tabela{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:6px 8px 6px 0;border-bottom:1px solid var(--line)}
td{padding:9px 8px 9px 0;border-bottom:1px solid var(--line);vertical-align:top}
td.num,th.num{text-align:right}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 16px}
.kv div{display:flex;flex-direction:column;min-width:0}.kv .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.kv .v{font-weight:600;overflow-wrap:anywhere}
.bloco{background:var(--sunk);border-radius:8px;padding:12px;font-size:15px;overflow-wrap:anywhere;white-space:pre-wrap}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.seg button{border:1.5px solid var(--line);background:var(--sunk);color:var(--ink);border-radius:8px;padding:12px 8px;font:600 15px var(--body);cursor:pointer;min-height:48px}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.vazio{text-align:center;padding:28px 12px;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:center}
.vazio b{color:var(--ink);font-size:17px}
.erro{color:var(--bad);font-size:14px}
.aviso{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:12px;font-size:14px}
.link{color:var(--info);font-weight:600;overflow-wrap:anywhere}
.check{flex-direction:row;align-items:center;gap:10px;font-weight:500}
.check input{width:24px;height:24px;min-height:0;accent-color:var(--accent)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:12px 18px;border-radius:8px;font-weight:600;z-index:20;max-width:calc(100% - 32px);text-align:center}
.carregando{text-align:center;padding:40px 0;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.estado{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding-block:0 8px}
.estado>span:nth-child(2){min-width:0;flex:1}
.estado .bola{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none}
.estado.off .bola{background:var(--bad)}
.estado.sync .bola{background:var(--warn)}
.estado b{color:var(--ink);font-weight:600}
.estado button{margin-left:auto;flex:none;background:none;border:1.5px solid var(--line);color:var(--ink);font:600 13px var(--body);border-radius:999px;padding:5px 12px;cursor:pointer;min-height:32px}
.pend{position:relative}
.pend::after{content:'pendente';position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);color:#fff;font-size:10px;text-align:center;padding:2px}
.alerta-fila{display:flex;gap:10px;align-items:center;background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:12px 14px;font-weight:600;border:0;width:100%;text-align:left;font-family:var(--body);font-size:15px;cursor:pointer}
.alerta-fila.leve{background:var(--warn-bg);color:var(--warn)}
.instalar{background:var(--info-bg);color:var(--info);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;font-size:15px}
.instalar .btn{background:var(--info);color:#fff}
.rodape{text-align:center;font-size:12px;color:var(--muted);padding-top:8px}
</style>
</head>
<body>
<header><div class="wrap"><div class="barra" id="barra"></div><div class="estado" id="estado" hidden></div></div></header>
<main class="wrap" id="app"><div class="carregando">Carregando…</div></main>
<div id="toast" hidden></div>
<input type="file" id="arquivoFoto" accept="image/*" multiple hidden>
<script src="config.js"></script>
<script src="sync.js"></script>
<script src="app.js"></script>
</body>
</html>
